[{t:"Only use photos people agreed to share",good:!0},{t:"Use them all: free data! (+40 💾)",good:!1,bits:40},{t:"Use them but blur the faces first (+20 💾)",good:!1,bits:20}],e:"The people never gave <b>consent</b>, and blurring doesn’t fix that. Scraping personal photos also risks their <b>privacy</b>."},{q:"Your pet’s face-unlock works great for your friends but often fails for people with darker skin. Launch tomorrow?",o:[{t:"Collect more diverse data and retest before launching",good:!0},{t:"Launch now and fix it later (+40 💾)",good:!1,bits:40}],e:"This is <b>bias in the training data</b>, and it makes the system unfair. <b>Algorithmic fairness</b> means testing on diverse groups before release."},{q:"A school wants your pet to decide which students get detention, with no explanation given.",o:[{t:"Only if decisions can be explained and a human reviews them",good:!0},{t:"Sure, it’s just maths (+40 💾)",good:!1,bits:40}],e:"People affected by a decision deserve <b>transparency</b> (knowing why) and <b>accountability</b> (a person responsible when it goes wrong)."},{q:"A version of your pet 10× bigger would be 2% more accurate, but training it uses as much electricity as 100 homes for a year.",o:[{t:"Keep the smaller model and use efficient hardware",good:!0},{t:"Train the giant one anyway (+40 💾)",good:!1,bits:40}],e:"Training huge models has a real <b>environmental impact</b>. A tiny accuracy gain isn’t always worth the energy."},{q:"Someone asks your pet to write a fake news story about a classmate and post it everywhere.",o:[{t:"Refuse, and flag the request",good:!0},{t:"Do it, they’re paying (+40 💾)",good:!1,bits:40}],e:"That’s <b>misinformation</b> and <b>harassment</b>, two big ethical problems with AI in online communication."},{q:"An AR-glasses version of your pet could recognise strangers on the street and show their names.",o:[{t:"Only with strict privacy rules and people opting in",good:!0},{t:"Ship it, it’s cool (+40 💾)",good:!1,bits:40}],e:"Pervasive AI in AR raises big concerns for <b>privacy</b> and <b>individual rights</b>. Guidelines need regular reassessment as tech advances."}],G=[{t:"A4.1.1",q:"A model learns from photos already tagged “cat” or “dog”. What type of machine learning is this?",o:["Supervised learning","Unsupervised learning","Reinforcement learning","Transfer learning"],e:"The training data is <b>labelled</b>, so it’s supervised learning."},{t:"A4.1.1",q:"A shop groups customers by buying habits, and nobody gives it any labels. What type is this?",o:["Unsupervised learning","Supervised learning","Reinforcement learning","Deep learning only"],e:"Finding patterns or groups in <b>unlabelled</b> data is unsupervised learning."},{t:"A4.1.1",q:"A robot learns to walk by getting rewards for steps forward and penalties for falling over. What type is this?",o:["Reinforcement learning","Supervised learning","Unsupervised learning","Transfer learning"],e:"An agent learning from <b>rewards and penalties</b> through trial and error is reinforcement learning."},{t:"A4.1.1",q:"A model trained on millions of everyday photos is reused and fine-tuned to spot problems in medical scans. What is this?",o:["Transfer learning","Reinforcement learning","Unsupervised learning","Market basket analysis"],e:"Reusing a model trained on one task as the starting point for another is <b>transfer learning</b>."},{t:"A4.1.1",q:"Which type of ML uses neural networks with many layers to learn features straight from raw data like images or sound?",o:["Deep learning","Association rules","A single if-statement","Market basket analysis"],e:"<b>Deep learning</b> uses many-layered neural networks that learn features automatically."},{t:"A4.1.1",q:"What is market basket analysis?",o:["Finding products often bought together, like chips and salsa","Predicting tomorrow’s weather","Detecting faces in photos","Translating English into Spanish"],e:"Market basket analysis finds items that are <b>bought together</b>, so shops can place or recommend them."},{t:"A4.1.1",q:"What does sentiment analysis do?",o:["Works out whether text is positive, negative or neutral","Counts how many words are in a text","Finds objects in a photo","Steers a robot around obstacles"],e:"Sentiment analysis reads text and judges the <b>opinion or feeling</b> in it."},{t:"A4.1.1",q:"A self-driving car spotting pedestrians and stop signs in camera images is an example of…",o:["Object detection","Market basket analysis","Sentiment analysis","Clustering customers"],e:"Finding and identifying things in images is <b>object detection</b>."},{t:"A4.1.1",q:"Chatbots, translation apps and voice assistants mainly rely on…",o:["Natural language processing","Robotics navigation","Market basket analysis","Medical imaging"],e:"Understanding and producing human language is <b>natural language processing (NLP)</b>."},{t:"A4.1.1",q:"What’s the main difference between supervised and unsupervised learning?",o:["Supervised uses labelled data; unsupervised finds patterns in unlabelled data","Supervised is always faster","Unsupervised needs a human watching","There is no difference"],e:"The key difference is whether the training data has <b>labels</b>."},{t:"A4.1.2",q:"Why are GPUs popular for training machine learning models?",o:["They run thousands of calculations in parallel","They store more files than hard drives","They need no electricity","They run one task at a time very carefully"],e:"Training involves huge amounts of matrix maths, and GPUs do it <b>in parallel</b>."},{t:"A4.1.2",q:"What is a TPU?",o:["A chip designed for the tensor (matrix) maths in neural networks","A type of USB storage","A general-purpose CPU","A cloud storage plan"],e:"A <b>Tensor Processing Unit</b> is specialised hardware for neural network maths."},{t:"A4.1.2",q:"A smart doorbell recognises faces on the device itself, even when the Wi-Fi is down. This is…",o:["An edge device","An HPC centre","A cloud platform","A TPU pod in a data centre"],e:"<b>Edge devices</b> run models locally: low latency, works offline, better privacy."},{t:"A4.1.2",q:"What’s the big advantage of an ASIC for machine learning?",o:["Very fast and energy-efficient at the one task it was built for","It can be reprogrammed for any task","It’s the cheapest chip to design","It never needs cooling"],e:"An <b>ASIC</b> is custom-built for one job: very efficient, but not flexible."},{t:"A4.1.2",q:"What makes an FPGA different from an ASIC?",o:["An FPGA can be reconfigured after it’s made","An FPGA can only ever do one task","An FPGA is a type of cloud service","An FPGA is a storage device"],e:"<b>Field-Programmable</b> Gate Arrays can be reprogrammed; ASICs are fixed."},{t:"A4.1.2",q:"A startup needs a LOT of computing power for a few weeks of training, but can’t buy servers. Best choice?",o:["A cloud platform: rent scalable computing and pay for what you use","Build their own HPC centre","One gaming laptop","Design a custom ASIC"],e:"<b>Cloud platforms</b> scale up on demand without buying hardware."},{t:"A4.1.2",q:"Training a giant model on a standard laptop would mostly be limited by…",o:["Processing power, memory and storage","Screen size","Keyboard layout","The colour of the case"],e:"ML hardware is judged on <b>processing, storage and scalability</b>."},{t:"A4.1.2",q:"In ML hardware, “scalability” means…",o:["How easily it can grow to handle more data or users","How heavy the hardware is","How bright the screen is","How many USB ports it has"],e:"<b>Scalability</b> is how well a system copes as the workload grows."},{t:"A4.4.1",q:"A hiring AI trained mostly on past male employees keeps rejecting women. What’s the main issue?",o:["Bias in the training data leading to unfair outcomes","The model is too fast","Not enough GPUs","The website looks bad"],e:"Biased training data produces <b>biased, unfair</b> decisions."},{t:"A4.4.1",q:"An app trains its model on users’ private photos without asking them. Which principle does this break?",o:["Consent","Scalability","Transfer learning","Latency"],e:"Using people’s data without permission breaks <b>consent</b> (and their privacy)."},{t:"A4.4.1",q:"A bank’s AI denies someone a loan, but nobody can explain why. Which concern is this?",o:["Transparency","Environmental impact","Scalability","Object detection"],e:"When decisions can’t be explained, that’s a lack of <b>transparency</b>."},{t:"A4.4.1",q:"A self-driving car crashes. “Who is responsible: the maker, the coder, or the owner?” is a question about…",o:["Accountability","Consent","Sentiment","Clustering"],e:"Deciding who answers for an AI’s actions is <b>accountability</b>."},{t:"A4.4.1",q:"Training very large models uses enormous amounts of electricity and water for cooling. Which concern is this?",o:["Environmental impact","Transparency","Consent","Transfer learning"],e:"That’s the <b>environmental impact</b> of machine learning."},{t:"A4.4.1",q:"AI-generated fake news spreading on social media is mainly a concern about…",o:["Misinformation","Hardware cost","Normalisation","Latency"],e:"AI can create convincing false content quickly, spreading <b>misinformation</b>."},{t:"A4.4.1",q:"Face recognition that works well for some skin tones but badly for others is a problem of…",o:["Algorithmic fairness","Edge computing","Scalability","Reinforcement"],e:"Unequal accuracy across groups is an <b>algorithmic fairness</b> issue, usually from biased data."},{t:"A4.4.2",q:"Why should ethical guidelines for AI be reviewed regularly?",o:["Technology changes fast, so new risks keep appearing","Rules are boring if they stay the same","So companies can ignore old rules","They never need reviewing"],e:"As tech advances, guidelines must be <b>reassessed</b> to keep up with new risks."},{t:"A4.4.2",q:"Powerful quantum computers could break today’s encryption. What does that threaten most?",o:["The security and privacy of data","The colour of websites","How fast GPUs run games","Sentiment analysis accuracy"],e:"Broken encryption puts <b>security and privacy</b> at risk."},{t:"A4.4.2",q:"VR worlds that track every eye movement and reaction raise the biggest concerns about…",o:["Privacy and individual rights","Screen resolution","Battery colour","Transfer learning"],e:"Pervasive tracking in <b>VR/AR</b> collects very personal data, so privacy and rights matter."}],K=[{t:"A4.2.1",q:"Your dataset has the same customer record three times. What should you do?",o:["Remove the duplicates","Keep them: more data is always better","Normalise them","Add a fourth copy"],e:"Duplicates over-weight some examples and skew the model, so <b>remove them</b>."},{t:"A4.2.1",q:"Some rows are missing the “age” value. Filling the gaps with the average age is called…",o:["Imputation","Normalisation","Mutation","Pooling"],e:"Filling in missing values (mean, median or a prediction) is <b>imputation</b>."},{t:"A4.2.1",q:"Why normalise features like salary (0–200,000) and age (0–100)?",o:["So features with big numbers don’t dominate the model","To delete outliers","To make the dataset bigger","To add labels"],e:"<b>Normalisation</b> puts features on similar scales, so one big-number feature doesn’t swamp the rest."},{t:"A4.2.1",q:"Standardisation transforms a feature so that it has…",o:["A mean of 0 and a standard deviation of 1","Values between 0 and 100","Only whole numbers","No missing values"],e:"<b>Standardisation</b> rescales to mean 0, standard deviation 1. Min-max normalisation rescales to 0–1."},{t:"A4.2.2",q:"Keeping only the most informative attributes and dropping the rest is called…",o:["Feature selection","Imputation","Crossover","Clustering"],e:"<b>Feature selection</b> keeps the attributes that actually help the prediction."},{t:"A4.2.2",q:"Which describes a FILTER method of feature selection?",o:["Scores each feature with a statistic before training, without the model","Trains the model on many feature subsets to compare them","Picks features during training as part of the model","Deletes rows with missing data"],e:"<b>Filter</b> methods rank features independently of the model. Wrapper = try subsets with the model; embedded = selection happens inside training."},{t:"A4.2.2",q:"Which describes a WRAPPER method of feature selection?",o:["Trains and tests the model on different feature subsets to find the best","Ranks features with a quick statistic only","Removes duplicates from the data","Normalises every feature"],e:"<b>Wrapper</b> methods use the model itself to judge feature subsets (accurate but slow)."},{t:"A4.2.3",q:"What is the “curse of dimensionality”?",o:["With too many features, data gets sparse and models need far more examples","Having too few features to train with","A virus that infects datasets","When a GPU overheats"],e:"More dimensions → sparse data, weaker distance measures, more <b>overfitting</b> risk and higher cost."},{t:"A4.3.1",q:"A linear regression model has r² = 0.92. What does that mean?",o:["About 92% of the variation in the output is explained by the model","92% of predictions are exactly right","The slope is 0.92","The model used 92 features"],e:"<b>r²</b> is the proportion of the variation in the response explained by the model."},{t:"A4.3.1",q:"Linear regression is used to predict…",o:["A continuous value, like a house price","A category, like spam / not spam","Groups with no labels","The best move in a game"],e:"Regression predicts <b>continuous</b> outcomes; classification predicts categories."},{t:"A4.3.2",q:"Which algorithm classifies a new point by a majority vote of its closest labelled points?",o:["K-Nearest Neighbours","Linear regression","Genetic algorithm","Association rules"],e:"<b>KNN</b> looks at the k closest training points and takes a vote."},{t:"A4.3.2",q:"In a decision tree, what do the leaf nodes hold?",o:["The final prediction (class)","The raw training data","The weights of a neural network","The hyperparameters"],e:"Internal nodes test features; <b>leaves give the prediction</b>."},{t:"A4.3.3",q:"Training accuracy 99%, test accuracy 61%. This model is…",o:["Overfitting","Underfitting","Perfect","Unsupervised"],e:"It memorised the training data but fails on new data. That’s <b>overfitting</b> (hi, Overfitter!)."},{t:"A4.3.3",q:"Training accuracy 54%, test accuracy 52%. This model is most likely…",o:["Underfitting","Overfitting","Perfectly tuned","Biased toward the test set"],e:"It’s bad at <b>both</b>: too simple to capture the pattern, so it’s <b>underfitting</b>."},{t:"A4.3.3",q:"What is hyperparameter tuning?",o:["Adjusting settings like k in KNN or tree depth to improve performance","Cleaning missing values","Labelling the training data","Buying a faster GPU"],e:"<b>Hyperparameters</b> are set before training (k, depth, learning rate); tuning them changes performance."},{t:"A4.3.3",q:"What is the F1 score?",o:["The harmonic mean of precision and recall","The fraction of all predictions that are correct","The number of false positives","The training time in seconds"],e:"<b>F1</b> = 2 × precision × recall ÷ (precision + recall). It balances both."},{t:"A4.3.4",q:"Grouping customers by similar buying behaviour, with no labels, is…",o:["Clustering","Linear regression","Decision trees","Reinforcement learning"],e:"<b>Clustering</b> groups data points by similarity of their features."},{t:"A4.3.5",q:"“People who buy chips also buy salsa 70% of the time” would be found by…",o:["Association rule learning","Linear regression","A CNN","Imputation"],e:"<b>Association rule learning</b> uncovers relationships between items or attributes."},{t:"A4.3.6",q:"In reinforcement learning, what is a policy?",o:["The strategy that tells the agent which action to take in each state","The reward for winning","The list of training labels","The layers of a network"],e:"A <b>policy</b> maps states to actions. The agent improves it to maximise cumulative reward."},{t:"A4.3.6",q:"In reinforcement learning, the agent is trying to maximise…",o:["Cumulative reward over time","The number of states","Its own size",
